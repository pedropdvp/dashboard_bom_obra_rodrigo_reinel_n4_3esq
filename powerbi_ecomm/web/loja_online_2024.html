<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Loja Online 2024</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: executive dark command board — header + nav, one filter rail, KPI strip, chart grid per page. */
:root {
  color-scheme: dark;
  --canvas: #0A0D13;
  --surface: #131821;
  --surface-2: #171D27;
  --surface-3: #1C2330;
  --line: #252D3A;
  --grid: #212835;
  --fg: #F2F4F8;
  --text: #D5DAE3;
  --muted: #8B94A5;
  --faint: #5C6575;
  --accent: #3D8BFF;
  --accent-hi: #5A9DFF;
  --s1: #3D8BFF; --s2: #C2840F; --s3: #0FA38C; --s4: #E5506B; --s5: #B35CD6;
  --good: #2DD4BF; --warn: #FFB547; --bad: #FF6B81;
  --font: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 16px;
}
* { box-sizing: border-box; }
html, body { background: var(--canvas); }
body {
  margin: 0; color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.45;
  background:
    radial-gradient(1100px 700px at -5% -20%, rgba(61,139,255,.16), transparent 70%),
    radial-gradient(900px 700px at 105% 110%, rgba(15,163,140,.10), transparent 70%),
    var(--canvas);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1680px; margin: 0 auto; padding-inline: 32px; padding-block: 24px 20px; display: grid; gap: 18px; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

/* header */
.top { display: flex; gap: 20px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 18px; }
.kicker { color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
h1 { margin: 4px 0 0; color: var(--fg); font-size: clamp(24px, 3vw, 34px); font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
nav { display: flex; gap: 8px; flex-wrap: wrap; }
nav button {
  border: 1px solid var(--line); background: var(--surface); color: var(--text);
  padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 13px; cursor: pointer; transition: background .15s, color .15s;
}
nav button:hover { background: var(--surface-3); color: var(--fg); }
nav button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

/* filters */
.filters { display: grid; grid-template-columns: 1.1fr 1.4fr 1.2fr .9fr auto; gap: 12px; align-items: stretch; }
.fgroup { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px 12px; min-width: 0; }
.fgroup label, .flabel { display: block; font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  flex: 1 1 auto; border: 1px solid var(--line); background: var(--surface-3); color: var(--text);
  border-radius: 9px; padding: 6px 10px; font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap;
}
.chip:hover { color: var(--fg); border-color: #3A4456; }
.chip[aria-pressed="true"] { background: var(--fg); color: #0A0D13; border-color: var(--fg); }
select {
  width: 100%; background: var(--surface-3); border: 1px solid var(--line); border-radius: 9px; padding: 6px 10px; font-size: 12.5px; font-weight: 600;
}
.reset { align-self: stretch; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 14px; padding: 0 18px; font-weight: 600; cursor: pointer; }
.reset:hover:not(:disabled) { color: var(--fg); border-color: #3A4456; }
.reset:disabled { opacity: .45; cursor: default; }

/* kpis */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 22px 18px; position: relative; min-width: 0; }
.kpi .tick { width: 28px; height: 4px; border-radius: 2px; margin-bottom: 12px; }
.kpi .lbl { color: var(--muted); font-size: 12.5px; font-weight: 600; }
.kpi .val { color: var(--fg); font-size: clamp(26px, 2.6vw, 36px); font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-top: 2px; white-space: nowrap; }
.kpi .sub { color: var(--faint); font-size: 12px; margin-top: 2px; font-variant-numeric: tabular-nums; }

/* panels */
.grid { display: grid; gap: 16px; }
.g-ov { grid-template-columns: 1fr 1.35fr 1fr; }
.g-pr { grid-template-columns: 1.65fr 1fr; }
.g-geo { grid-template-columns: 1fr 1fr; }
.g-geo2 { grid-template-columns: 1.5fr 1fr; }
.g-lab { grid-template-columns: 1fr 1.2fr; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 20px 18px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.ph { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.ph h2 { margin: 0; color: var(--fg); font-size: 15px; font-weight: 700; letter-spacing: -.005em; }
.ph p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
.crumb { border: 0; background: var(--surface-3); color: var(--text); font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
.crumb:hover { color: var(--fg); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { font-family: var(--font); }
.ax { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.gl { stroke: var(--grid); stroke-dasharray: 2 4; }
.vlab { fill: var(--fg); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.clab { fill: var(--text); font-size: 12px; font-weight: 600; }
.hit { cursor: pointer; }
.mark { transition: opacity .15s; }
.dim .mark:not(.on) { opacity: .35; }

/* tables */
.tw { overflow-x: auto; margin-inline: -4px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
th { text-align: right; color: var(--muted); font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--fg); }
th .dir { color: var(--accent); }
td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--grid); color: var(--text); white-space: nowrap; }
tbody tr:hover td { background: var(--surface-2); }
tr.grp td { color: var(--fg); font-weight: 700; background: var(--surface-2); cursor: pointer; }
tr.grp td:first-child::before { content: "▾"; display: inline-block; width: 16px; color: var(--muted); }
tr.grp.closed td:first-child::before { content: "▸"; }
tr.sub td:first-child { padding-left: 30px; }
tfoot td { color: var(--fg); font-weight: 700; background: var(--surface-3); border-bottom: 0; }
.bar { position: relative; display: inline-flex; align-items: center; justify-content: flex-end; min-width: 150px; }
.bar span.fill { position: absolute; left: 0; top: 50%; height: 16px; transform: translateY(-50%); background: color-mix(in srgb, var(--accent) 35%, transparent); border-radius: 0 4px 4px 0; }
.bar b { position: relative; font-weight: 600; color: var(--fg); }
.ind { display: inline-flex; align-items: center; gap: 6px; }
.ind svg { width: 10px; height: 10px; display: inline-block; }
code { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 12px; color: var(--text); background: var(--surface-3); padding: 2px 6px; border-radius: 6px; }

/* maps */
.map { position: relative; border-radius: 12px; overflow: hidden; background: radial-gradient(120% 100% at 50% 40%, #101520, #0B0F16); }
.map .land { fill: #1A202B; stroke: #2A3240; stroke-width: .8; }
.map .land.data { fill: #232B39; stroke: #3A4559; cursor: pointer; }
.map .land.data:hover { fill: #2B3546; }
.map .land.sel { fill: #23406E; stroke: var(--accent); }
.mlab { fill: var(--fg); font-size: 15px; font-weight: 700; paint-order: stroke; stroke: #0B0F16; stroke-width: 4px; }
.mval { fill: var(--muted); font-size: 13px; font-weight: 600; paint-order: stroke; stroke: #0B0F16; stroke-width: 4px; font-variant-numeric: tabular-nums; }

/* tooltip */
#tip { position: fixed; z-index: 10; pointer-events: none; background: var(--surface-3); border: 1px solid #323B4B; border-radius: 10px; padding: 9px 12px; font-size: 12.5px; color: var(--text); box-shadow: 0 10px 30px rgba(0,0,0,.45); min-width: 160px; font-variant-numeric: tabular-nums; }
#tip .t { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; }
#tip .r { display: flex; justify-content: space-between; gap: 16px; }
#tip .r b { color: var(--fg); }
#tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }

footer { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--faint); font-size: 11.5px; padding-top: 4px; }
.empty { color: var(--muted); font-size: 13px; padding: 30px 0; text-align: center; }

@media (max-width: 1200px) {
  .filters { grid-template-columns: 1fr 1fr; }
  .reset { padding: 10px; }
  .g-ov { grid-template-columns: 1fr 1fr; }
  .g-ov > :nth-child(2) { grid-column: 1 / -1; order: -1; }
  .g-pr, .g-geo, .g-geo2, .g-lab { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .wrap { padding-inline: 16px; }
  .kpis { grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi { padding: 14px 16px; }
  .filters { grid-template-columns: 1fr; }
  .g-ov { grid-template-columns: 1fr; }
  nav { width: 100%; }
  nav button { flex: 1 1 auto; padding: 9px 12px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

// ---------- tooltip ----------
const tip = document.getElementById("tip");
function showTip(e, title, lines) {
  tip.innerHTML = `<div class="t">${esc(title)}</div>` + lines.map(([k, v, c]) =>
    `<div class="r"><span>${c ? `<i style="background:${c}"></i>` : ""}${esc(k)}</span><b>${esc(v)}</b></div>`).join("");
  tip.hidden = false; moveTip(e);
}
function moveTip(e) {
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + pad, y = e.clientY + pad;
  if (x + w > innerWidth - 8) x = e.clientX - w - pad;
  if (y + h > innerHeight - 8) y = e.clientY - h - pad;
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
}
const hideTip = () => { tip.hidden = true; };
function bindTip(el, fn) {
  el.addEventListener("pointermove", e => { const t = fn(e); t ? showTip(e, t[0], t[1]) : hideTip(); });
  el.addEventListener("pointerleave", hideTip);
}

// ---------- svg helpers ----------
const NS = "http://www.w3.org/2000/svg";
function svg(w, h, cls) { const s = document.createElementNS(NS, "svg"); s.setAttribute("viewBox", `0 0 ${w} ${h}`); if (cls) s.setAttribute("class", cls); return s; }
function el(tag, attrs, parent, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);

  if (parent) parent.appendChild(e); return e;
}
function niceMax(v, n = 4) {

}
// rect with rounded top only, anchored to baseline
function colPath(x, y, w, h, r = 4) {
  if (h <= 0) return "";
  r = Math.min(r, w / 2, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}
function barPathH(x, y, w, h, r = 4) {
  if (w <= 0) return "";
  r = Math.min(r, h / 2, w);
  return `M${x},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h - r}Q${x + w},${y + h} ${x + w - r},${y + h}H${x}Z`;
}
function panel(host, title, sub, extra) {

  p.innerHTML = `<div class="ph"><div><h2>${esc(title)}</h2>${sub ? `<p>${esc(sub)}</p>` : ""}</div><div class="phx"></div></div><div class="pb"></div>`;
  if (extra) p.querySelector(".phx").append(extra);
  host.append(p); return p.querySelector(".pb");
}

// ---------- charts ----------
let drillCat = null;
function columnChart(host, data, onClick, selected) {
  const W = 520, H = 430, L = 44, R = 8, T = 26, B = 46;
  const s = svg(W, H); if (selected) s.classList.add("dim");
  const { max, step } = niceMax(Math.max(...data.map(d => d.v), 1));
  const y = v => T + (H - T - B) * (1 - v / max);
  for (let t = 0; t <= max + 1e-9; t += step) { el("line", { x1: L, x2: W - R, y1: y(t), y2: y(t), class: "gl" }, s); el("text", { x: L - 8, y: y(t) + 4, "text-anchor": "end", class: "ax" }, s, kAx(t)); }
  const bw = (W - L - R) / data.length, w = Math.min(64, bw * 0.56);
  data.forEach((d, i) => {
    const x = L + bw * i + (bw - w) / 2, yy = y(d.v);
    el("path", { d: colPath(x, yy, w, y(0) - yy), fill: "var(--s1)", class: "mark" + (selected === d.k ? " on" : "") }, s);
    el("text", { x: x + w / 2, y: yy - 8, "text-anchor": "middle", class: "vlab" }, s, eurK(d.v).replace(" €", ""));
    const lab = el("text", { x: x + w / 2, y: H - B + 20, "text-anchor": "middle", class: "clab" }, s, d.k);
    if (d.k.length > 12 && bw < 90) lab.setAttribute("font-size", "10.5");
    const hit = el("rect", { x: L + bw * i, y: T, width: bw, height: H - T - B + 30, fill: "transparent", class: onClick ? "hit" : "" }, s);
    bindTip(hit, () => [d.k, [["Total Vendas", eur(d.v), "var(--s1)"], ["Lucro Total", eur(d.l), "var(--s3)"], ["Margem", pct(d.v ? d.l / d.v : null)]]]);
    if (onClick) hit.addEventListener("click", () => onClick(d.k));
  });
  host.append(s);
}

function lineChart(host, series) {
  const W = 720, H = 360, L = 48, R = 70, T = 16, B = 34;
  const s = svg(W, H);
  const all = series.flatMap(sr => sr.v);
  const { max, step } = niceMax(Math.max(...all, 1));
  const x = i => L + (W - L - R) * i / 11, y = v => T + (H - T - B) * (1 - v / max);
  for (let t = 0; t <= max + 1e-9; t += step) { el("line", { x1: L, x2: W - R, y1: y(t), y2: y(t), class: "gl" }, s); el("text", { x: L - 8, y: y(t) + 4, "text-anchor": "end", class: "ax" }, s, kAx(t)); }
  MESES.forEach((m, i) => el("text", { x: x(i), y: H - 10, "text-anchor": "middle", class: "ax" }, s, m));
  const defs = el("defs", {}, s);
  series.forEach((sr, si) => {
    const g = el("linearGradient", { id: "ga" + si, x1: 0, x2: 0, y1: 0, y2: 1 }, defs);
    el("stop", { offset: "0%", "stop-color": sr.c, "stop-opacity": si ? .10 : .22 }, g); el("stop", { offset: "100%", "stop-color": sr.c, "stop-opacity": 0 }, g);
    const pts = sr.v.map((v, i) => [x(i), y(v)]);
    const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join("");
    el("path", { d: line + `L${x(11)},${y(0)}L${x(0)},${y(0)}Z`, fill: `url(#ga${si})` }, s);
    el("path", { d: line, fill: "none", stroke: sr.c, "stroke-width": 2.5, "stroke-linejoin": "round", "stroke-linecap": "round" }, s);
    const last = pts[11];
    el("circle", { cx: last[0], cy: last[1], r: 4.5, fill: sr.c, stroke: "var(--surface)", "stroke-width": 2 }, s);
    el("text", { x: last[0] + 10, y: last[1] + 4, class: "vlab" }, s, kAx(sr.v[11]));
  });
  const cross = el("line", { y1: T, y2: H - B, stroke: "var(--muted)", "stroke-width": 1, "stroke-dasharray": "3 3", visibility: "hidden" }, s);
  const dots = series.map(sr => el("circle", { r: 5, fill: sr.c, stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" }, s));
  const hit = el("rect", { x: L - 10, y: T, width: W - L - R + 20, height: H - T - B, fill: "transparent" }, s);
  hit.addEventListener("pointerleave", () => { cross.setAttribute("visibility", "hidden"); dots.forEach(d => d.setAttribute("visibility", "hidden")); });
  bindTip(hit, e => {
    const pt = s.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(s.getScreenCTM().inverse());
    const i = Math.max(0, Math.min(11, Math.round((p.x - L) / ((W - L - R) / 11))));
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("visibility", "visible");
    dots.forEach((d, si) => { d.setAttribute("cx", x(i)); d.setAttribute("cy", y(series[si].v[i])); d.setAttribute("visibility", "visible"); });
    const v = series[0].v[i], l = series[1].v[i];
    return [MESES[i] + " 2024", [[series[0].n, eur(v), series[0].c], [series[1].n, eur(l), series[1].c], ["Margem", pct(v ? l / v : null)]]];
  });
  host.append(s);
}

function donut(host, data, total, onClick, selected) {
  const W = 460, H = 380, cx = W / 2, cy = 178, R = 128, r = 86;
  const s = svg(W, H); if (selected) s.classList.add("dim");
  let a0 = -Math.PI / 2; const gap = 0.012;
  data.forEach(d => {
    const frac = total ? d.v / total : 0, a1 = a0 + frac * Math.PI * 2;
    if (frac > 0) {
      const s0 = a0 + gap, s1 = Math.max(s0, a1 - gap), large = s1 - s0 > Math.PI ? 1 : 0;
      const p = (a, rr) => [cx + rr * Math.cos(a), cy + rr * Math.sin(a)];
      const [x0, y0] = p(s0, R), [x1, y1] = p(s1, R), [x2, y2] = p(s1, r), [x3, y3] = p(s0, r);
      const path = el("path", { d: `M${x0},${y0}A${R},${R} 0 ${large} 1 ${x1},${y1}L${x2},${y2}A${r},${r} 0 ${large} 0 ${x3},${y3}Z`, fill: d.c, class: "mark hit" + (selected === d.k ? " on" : "") }, s);
      bindTip(path, () => [d.k, [["Total Vendas", eur(d.v), d.c], ["Quota", pct(frac)], ["Lucro Total", eur(d.l)]]]);
      path.addEventListener("click", () => onClick(d.k));
      if (frac >= 0.04) {
        const am = (s0 + s1) / 2, [lx, ly] = p(am, R + 16), right = Math.cos(am) >= 0;
        el("text", { x: lx, y: ly + 4, "text-anchor": right ? "start" : "end", class: "clab" }, s, `${d.k} ${N0.format(frac * 100)}%`);
      }
    }
    a0 = a1;
  });
  el("text", { x: cx, y: cy - 4, "text-anchor": "middle", class: "ax", "font-size": 12 }, s, "Total");
  el("text", { x: cx, y: cy + 22, "text-anchor": "middle", class: "vlab", "font-size": 22 }, s, eurK(total).replace(" €", " €"));
  const lg = document.createElement("div"); lg.className = "legend"; lg.style.justifyContent = "center";
  lg.innerHTML = data.map(d => `<span><i style="background:${d.c}"></i>${esc(d.k)}</span>`).join("");
  host.append(s, lg);
}

function hbar(host, data) {
  const rowH = 34, L = 108, R = 76, W = 520, H = data.length * rowH + 8;
  const s = svg(W, H); const max = Math.max(...data.map(d => d.v), 1);

function spark(vals) {
  const W = 96, H = 24, max = Math.max(...vals, 1);
  const pts = vals.map((v, i) => `${(i * W / 11).toFixed(1)},${(H - 3 - (H - 6) * v / max).toFixed(1)}`);
  const li = vals.length - 1;

const dbar = (v, max) => `<span class="bar"><span class="fill" style="width:${max ? (100 * v / max).toFixed(1) : 0}%"></span><b>${eur(v)}</b></span>`;

// ---------- maps ----------
function mapBase(sel, opts = {}) {
  const s = svg(GEO.w, GEO.h);
  const g = el("g", opts.tilt ? { transform: opts.tilt } : {}, s);
  GEO.f.forEach(f => {
    const p = el("path", { d: f.d, class: "land" + (f.data ? " data" : "") + (f.n === sel ? " sel" : "") }, g);
    if (f.data) {
      p.addEventListener("click", () => togglePais(f.n));
      bindTip(p, () => { const m = M(rows(r => r.pais === f.n)); return [f.n, [["Total Vendas", eur(m.tv), "var(--s1)"], ["Lucro Total", eur(m.lt)], ["N.º Encomendas", N0.format(m.n)]]]; });
    }
  });
  return s;
}
const TILT = { a: 1, d: 0.62, ty: 150 };   // oblique "camera pitch"
const tiltPt = ([x, y]) => [x, y * TILT.d + TILT.ty];
function map3d(host) {
  const sel = F.pais;
  const s = mapBase(sel, { tilt: `translate(0 ${TILT.ty}) scale(1 ${TILT.d})` });
  s.setAttribute("viewBox", `0 40 ${GEO.w} ${Math.round(GEO.h * TILT.d + TILT.ty - 30)}`);
  const byP = group(rows(), "pais");
  const vals = PAISES.map(p => ({ k: p, m: M(byP.get(p) || []) }));
  const max = Math.max(...vals.map(v => v.m.tv), 1);
  const defs = el("defs", {}, s);
  const gf = el("linearGradient", { id: "colF", x1: 0, x2: 0, y1: 0, y2: 1 }, defs);
  el("stop", { offset: "0%", "stop-color": "#7FB2FF" }, gf); el("stop", { offset: "100%", "stop-color": "#2563D9" }, gf);
  vals.sort((a, b) => GEO.cent[a.k][1] - GEO.cent[b.k][1]).forEach(({ k, m }) => {
    const [cx, cy] = tiltPt(GEO.cent[k]), h = 300 * m.tv / max, w = 30, d = 12;
    const g = el("g", { class: "hit" }, s);
    el("ellipse", { cx: cx + d / 2, cy: cy + 2, rx: w * .9, ry: 9, fill: "#000", opacity: .35 }, g);
    if (h > 0) {
      el("path", { d: `M${cx + w / 2},${cy}l${d},${-d * .6}v${-h}l${-d},${d * .6}Z`, fill: "#1D4FB8" }, g);
      el("rect", { x: cx - w / 2, y: cy - h, width: w, height: h, fill: "url(#colF)" }, g);
      el("path", { d: `M${cx - w / 2},${cy - h}l${d},${-d * .6}h${w}l${-d},${d * .6}Z`, fill: "#A9CBFF" }, g);
    }

    el("text", { x: cx + d / 2, y: cy - h - 13, "text-anchor": "middle", class: "mval" }, g, eurK(m.tv));
    g.addEventListener("click", () => togglePais(k));
    bindTip(g, () => [k, [["Total Vendas", eur(m.tv), "var(--s1)"], ["Lucro Total", eur(m.lt), "var(--s3)"], ["N.º Encomendas", N0.format(m.n)]]]);
  });
  const box = document.createElement("div"); box.className = "map"; box.append(s); host.append(box);
}
function mapBubbles(host) {

    let html = `<div class="tw"><table><thead><tr><th>Categoria / SubCategoria</th><th>Margem %</th><th>Preço mín.</th><th>Preço máx.</th><th>Total Vendas</th><th>Tendência mensal</th></tr></thead><tbody>`;
    CATS.forEach(cat => {
      const list = subs.filter(s => s.cat === cat).sort((x, y) => y.m.tv - x.m.tv); if (!list.length) return;
      const cm = M(a.filter(r => r.cat === cat)), closed = COLLAPSED.has(cat);
      html += `<tr class="grp${closed ? " closed" : ""}" data-cat="${esc(cat)}" tabindex="0"><td>${esc(cat)}</td><td>${indicator(cm.marg, lo, hi)}</td><td>${eur2(cm.pMin)}</td><td>${eur2(cm.pMax)}</td><td>${eur(cm.tv)}</td><td></td></tr>`;
      if (!closed) list.forEach(s => { html += `<tr class="sub"><td>${esc(s.sub)}</td><td>${indicator(s.m.marg, lo, hi)}</td><td>${eur2(s.m.pMin)}</td><td>${eur2(s.m.pMax)}</td><td>${dbar(s.m.tv, maxV)}</td><td>${spark(s.sp)}</td></tr>`; });
    });
    const tm = M(a);
    html += `</tbody><tfoot><tr><td>Total</td><td>${pct(tm.marg)}</td><td>${eur2(tm.pMin)}</td><td>${eur2(tm.pMax)}</td><td>${eur(tm.tv)}</td><td></td></tr></tfoot></table></div>`;
    b1.innerHTML = subs.length ? html : `<div class="empty">Sem vendas para os filtros atuais.</div>`;
    b1.querySelectorAll("tr.grp").forEach(tr => { const t = () => { const c = tr.dataset.cat; COLLAPSED.has(c) ? COLLAPSED.delete(c) : COLLAPSED.add(c); render(); }; tr.onclick = t; tr.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); t(); } }; });
    const b2 = panel(g, "Ranking de SubCategorias", "Total de vendas (k€), do maior para o menor");
    hbar(b2, subs.map(s => ({ k: s.sub, cat: s.cat, v: s.m.tv, m: s.m.marg })).sort((x, y) => y.v - x.v));
  }},
  geografia: { title: "Clientes & Geografia — Europa", render(host) {
    const a = rows();
    const g = document.createElement("div"); g.className = "grid g-geo"; host.append(g);
    map3d(panel(g, "Europa em 3D — Vendas por País", "Altura da coluna = total de vendas · clique num país para filtrar"));
    mapBubbles(panel(g, "Concentração de Vendas na Europa", "Vendas por cidade dos clientes"));
    const g2 = document.createElement("div"); g2.className = "grid g-geo2"; host.append(g2);
    const b3 = panel(g2, "Top Clientes", "Clique nos cabeçalhos para ordenar");
    const byC = group(a, "cid");
    const cl = [...byC].map(([cid, rr]) => ({ cid, nome: CLI[cid][0], pais: CLI[cid][3], m: M(rr) }));
    const keyF = { nome: c => c.nome, pais: c => c.pais, n: c => c.m.n, tv: c => c.m.tv, med: c => c.m.med, maior: c => c.m.maior, menor: c => c.m.menor, desc: c => c.m.descMax };
    cl.sort((x, y) => { const a1 = keyF[SORT.k](x), b1 = keyF[SORT.k](y); return (a1 > b1 ? 1 : a1 < b1 ? -1 : 0) * SORT.dir; });
    const maxV = Math.max(...cl.map(c => c.m.tv), 1);
    const th = (k, l) => `<th class="sortable" data-k="${k}" aria-sort="${SORT.k === k ? (SORT.dir > 0 ? "ascending" : "descending") : "none"}">${l}${SORT.k === k ? ` <span class="dir">${SORT.dir > 0 ? "↑" : "↓"}</span>` : ""}</th>`;
    b3.innerHTML = cl.length ? `<div class="tw" style="max-height:420px;overflow:auto"><table><thead><tr>${th("nome","Cliente")}${th("pais","País")}${th("n","Encom.")}${th("tv","Total Vendas")}${th("med","Ticket médio")}${th("maior","Maior")}${th("menor","Menor")}${th("desc","Desc. máx.")}</tr></thead><tbody>` +
      cl.map(c => `<tr><td>${esc(c.nome)}</td><td style="text-align:left">${esc(c.pais)}</td><td>${N0.format(c.m.n)}</td><td>${dbar(c.m.tv, maxV)}</td><td>${eur(c.m.med)}</td><td>${eur(c.m.maior)}</td><td>${eur(c.m.menor)}</td><td>${pct(c.m.descMax, 0)}</td></tr>`).join("") +
      `</tbody></table></div>` : `<div class="empty">Sem clientes para os filtros atuais.</div>`;
    b3.querySelectorAll("th.sortable").forEach(t => t.onclick = () => { const k = t.dataset.k; SORT = { k, dir: SORT.k === k ? -SORT.dir : (k === "nome" || k === "pais" ? 1 : -1) }; render(); });
    const b4 = panel(g2, "Vendas por País × Segmento", "Mapa de calor · quanto mais intenso, maior o total");
    const byPS = group(a, r => r.pais + "|" + r.seg);
    const cells = PAISES.flatMap(p => SEGS.map(sg => sum(byPS.get(p + "|" + sg) || [], "total")));
    const cmax = Math.max(...cells, 1);
    const heat = v => { const t = v / cmax; return v ? `background:color-mix(in srgb, var(--s1) ${Math.round(12 + 78 * t)}%, var(--surface));color:${t > .55 ? "#fff" : "var(--text)"}` : "color:var(--faint)"; };
    b4.innerHTML = `<div class="tw"><table><thead><tr><th>País</th>${SEGS.map(s => `<th>${s}</th>`).join("")}<th>Total</th></tr></thead><tbody>` +
      PAISES.map(p => `<tr><td>${p}</td>${SEGS.map(sg => { const v = sum(byPS.get(p + "|" + sg) || [], "total"); return `<td style="${heat(v)}">${v ? eur(v) : "—"}</td>`; }).join("")}<td>${eur(sum(a.filter(r => r.pais === p), "total"))}</td></tr>`).join("") +
      `</tbody><tfoot><tr><td>Total</td>${SEGS.map(sg => `<td>${eur(sum(a.filter(r => r.seg === sg), "total"))}</td>`).join("")}<td>${eur(sum(a, "total"))}</td></tr></tfoot></table></div>`;
  }},
  medidas: { title: "Testar Medidas", render(host) {
    const a = rows(), m = M(a);

      `</tbody><tfoot><tr><td>Total</td><td>${eur(m.tv)}</td><td>${eur(m.lt)}</td><td>${pct(m.marg, 2)}</td></tr></tfoot></table></div>`;
    const b2 = panel(g, "Medidas DAX do modelo", "Fórmulas da tabela _Medidas e o valor de cada uma com os filtros atuais");
    const D = [["Total Vendas","SUM(Vendas[TotalVendas])",eur(m.tv)],["Lucro Total","SUM(Vendas[Lucro])",eur(m.lt)],["Unidades Vendidas","SUM(Vendas[Quantidade])",N0.format(m.un)],
      ["N Encomendas","COUNTROWS(Vendas)",N0.format(m.n)],["Encomenda Media","AVERAGE(Vendas[TotalVendas])",eur2(m.med)],["Margem %","DIVIDE([Lucro Total], [Total Vendas])",pct(m.marg, 2)],
      ["Maior Encomenda","MAX(Vendas[TotalVendas])",eur2(m.maior)],["Menor Encomenda","MIN(Vendas[TotalVendas])",eur2(m.menor)],["Desconto Máximo","MAX(Vendas[Desconto])",pct(m.descMax, 0)],
      ["Preço Máximo","MAX(Vendas[PreçoUnitário])",eur2(m.pMax)],["Preço Minimo","MIN(Vendas[PreçoUnitário])",eur2(m.pMin)],

let COLLAPSED = new Set(), SORT = { k: "tv", dir: -1 };

// ---------- filters + routing ----------
function togglePais(p) { F.pais = F.pais === p ? "" : p; document.getElementById("f-pais").value = F.pais; render(); }
function chips(id, values, set) {
  const host = document.getElementById(id);
  host.innerHTML = values.map(v => `<button type="button" class="chip" aria-pressed="false" data-v="${esc(v)}">${esc(v)}</button>`).join("");
  host.querySelectorAll(".chip").forEach(b => b.onclick = () => { const v = b.dataset.v; set.has(v) ? set.delete(v) : set.add(v); render(); });
}
chips("f-q", ["Q1","Q2","Q3","Q4"], F.q); chips("f-cat", CATS, F.cat); chips("f-seg", SEGS, F.seg);
const selP = document.getElementById("f-pais");
selP.innerHTML = `<option value="">Todos os países</option>` + PAISES.map(p => `<option>${p}</option>`).join("");
selP.onchange = () => { F.pais = selP.value; render(); };
document.getElementById("reset").onclick = () => { F.q.clear(); F.cat.clear(); F.seg.clear(); F.pais = ""; selP.value = ""; drillCat = null; render(); };

let PAGE = "visao";

document.querySelectorAll("nav button").forEach(b => b.onclick = () => { PAGE = b.dataset.page; try { history.replaceState(null, "", "#" + PAGE); } catch (e) {} try { localStorage.setItem("loja-page", PAGE); } catch (e) {} render(); window.scrollTo({ top: 0 }); });

function render() {
  hideTip();
  document.querySelectorAll(".chip").forEach(b => { const set = { "f-q": F.q, "f-cat": F.cat, "f-seg": F.seg }[b.parentElement.id]; b.setAttribute("aria-pressed", set.has(b.dataset.v)); });
  const n = F.q.size + F.cat.size + F.seg.size + (F.pais ? 1 : 0), rs = document.getElementById("reset");
  rs.disabled = !n; rs.textContent = n ? `Limpar filtros (${n})` : "Limpar filtros";
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-selected", b.dataset.page === PAGE));
  document.getElementById("ptitle").textContent = PAGES[PAGE].title;
  renderKpis(PAGE, M(rows()), M(ROWS));
  const host = document.getElementById("page"); host.innerHTML = ""; host.className = "grid";
  PAGES[PAGE].render(host);
}
PAGE = fromHash();
if (PAGE === "visao" && !location.hash) { try { const s = localStorage.getItem("loja-page"); if (PAGES[s]) PAGE = s; } catch (e) {} }
render();
