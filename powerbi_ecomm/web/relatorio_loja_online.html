<style>
/* Layout: report viewer — app bar, 1920×1080 report canvas scaled to fit, filters pane on the right, page tabs at the bottom. */
:root {
  color-scheme: dark;
  --outspace: #06080C;
  --chrome: #0F131A;
  --chrome-2: #161B24;
  --canvas: #0A0D13;
  --surface: #131821;
  --surface-2: #171D27;
  --surface-3: #1C2330;
  --line: #252D3A;
  --line-2: #323B4B;
  --grid: #212835;
  --fg: #F2F4F8;
  --text: #D5DAE3;
  --muted: #8B94A5;
  --faint: #5C6575;
  --accent: #3D8BFF;
  --s1: #3D8BFF; --s2: #C2840F; --s3: #0FA38C; --s4: #E5506B; --s5: #B35CD6;
  --good: #2DD4BF; --warn: #FFB547; --bad: #FF6B81;
  --font: "Segoe UI", "Noto Sans", system-ui, -apple-system, sans-serif;
  --font-semi: "Segoe UI Semibold", "Segoe UI", "Noto Sans", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--outspace); color: var(--text); font-family: var(--font); font-size: 13px; overflow: hidden; -webkit-font-smoothing: antialiased; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: 46px 1fr 40px; }
.bar { display: flex; align-items: center; gap: 14px; padding-inline: 16px; background: var(--chrome); border-bottom: 1px solid var(--line); min-width: 0; }
.bar .doc { display: flex; align-items: center; gap: 10px; min-width: 0; }
.bar .doc .ico { width: 22px; height: 22px; border-radius: 5px; background: linear-gradient(135deg, var(--s1), #2563D9); display: grid; place-items: center; flex: none; }
.bar .doc b { color: var(--fg); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .doc span { color: var(--faint); white-space: nowrap; }
.bar .sp { flex: 1; }
.tbtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid transparent; background: transparent; color: var(--text); padding: 6px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
.tbtn:hover:not(:disabled) { background: var(--chrome-2); color: var(--fg); }
.tbtn:disabled { opacity: .4; cursor: default; }
.tbtn[aria-pressed="true"] { background: var(--chrome-2); border-color: var(--line-2); color: var(--fg); }
.tbtn svg { width: 16px; height: 16px; flex: none; }

.main { display: grid; grid-template-columns: 1fr auto; min-height: 0; }
.stage { position: relative; overflow: auto; min-width: 0; display: grid; place-items: center; padding: 14px; }
.stage.fitw { place-items: start center; }
.scaler { position: relative; flex: none; }
.canvas { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; background: var(--canvas) center / cover no-repeat; overflow: hidden; box-shadow: 0 0 0 1px #11161E, 0 18px 50px rgba(0,0,0,.5); }

/* filters pane */
.fpane { width: 290px; background: var(--chrome); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.fpane.closed { width: 40px; }
.fpane .fh { display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 8px 16px; }
.fpane .fh h2 { margin: 0; font-size: 15px; color: var(--fg); font-weight: 600; }
.fpane.closed .fh { flex-direction: column; padding: 10px 4px; gap: 14px; }
.fpane.closed .fh h2 { writing-mode: vertical-rl; font-size: 13px; color: var(--muted); }
.fpane.closed .fbody { display: none; }
.fbody { overflow: auto; padding: 4px 12px 16px; display: grid; gap: 10px; align-content: start; }
.fsec { color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .04em; margin: 6px 4px 0; }
.fcard { background: var(--chrome-2); border: 1px solid var(--line); border-radius: 8px; }
.fcard.on { border-color: #2F4F86; }
.fcard .fct { display: flex; align-items: center; gap: 6px; padding: 9px 10px; cursor: pointer; }
.fcard .fct b { color: var(--fg); font-weight: 600; flex: 1; }
.fcard .fct small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 190px; }
.fcard .clr { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 2px 4px; border-radius: 4px; }
.fcard .clr:hover { color: var(--fg); background: var(--surface-3); }
.fcard .chev { color: var(--muted); transition: transform .15s; }
.fcard.open .chev { transform: rotate(180deg); }
.fcard .fl { display: none; padding: 2px 10px 10px; border-top: 1px solid var(--line); }
.fcard.open .fl { display: grid; gap: 2px; }
.fl label { display: flex; align-items: center; gap: 8px; padding: 4px 2px; cursor: pointer; color: var(--text); }
.fl label:hover { color: var(--fg); }
.fl input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
.fl .mode { color: var(--faint); font-size: 11.5px; padding: 6px 2px 4px; }

/* bottom tabs */
.tabs { display: flex; align-items: stretch; background: var(--chrome); border-top: 1px solid var(--line); min-width: 0; }
.tabs nav { display: flex; overflow-x: auto; min-width: 0; flex: 1; scrollbar-width: none; }
.tabs nav button { border: 0; border-top: 3px solid transparent; background: transparent; color: var(--muted); padding: 0 18px; cursor: pointer; white-space: nowrap; font-weight: 600; }
.tabs nav button:hover { color: var(--fg); background: var(--chrome-2); }
.tabs nav button[aria-selected="true"] { color: var(--fg); border-top-color: var(--accent); background: var(--chrome-2); }
.tabs .zoom { display: flex; align-items: center; gap: 8px; padding-inline: 12px; color: var(--muted); border-left: 1px solid var(--line); }
.tabs select { background: var(--chrome-2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }

/* visuals */
.v { position: absolute; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 18px 16px; display: flex; flex-direction: column; }
.card .vt { color: var(--fg); font: 600 17px/1.25 var(--font-semi); }
.card .vs { color: var(--muted); font-size: 13px; margin-top: 3px; }
.card .vb { flex: 1; min-height: 0; position: relative; margin-top: 12px; }
.card.nohead .vb { margin-top: 0; }
.vh { position: absolute; top: 8px; right: 10px; display: flex; gap: 2px; opacity: 0; transition: opacity .12s; background: var(--surface); border-radius: 6px; padding: 2px; z-index: 3; }
.v:hover .vh, .v:focus-within .vh { opacity: 1; }
@media (hover: none) { .vh { opacity: .8; } }
.vh button { border: 0; background: transparent; color: var(--muted); width: 26px; height: 26px; border-radius: 5px; display: grid; place-items: center; cursor: pointer; padding: 0; }
.vh button:hover:not(:disabled) { color: var(--fg); background: var(--surface-3); }
.vh button[aria-pressed="true"] { color: #fff; background: var(--accent); }
.vh button:disabled { opacity: .35; cursor: default; }
.vh svg { width: 15px; height: 15px; }
svg.chart { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
svg text { font-family: var(--font); }
.ax { fill: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.gl { stroke: var(--grid); stroke-dasharray: 2 4; }
.vlab { fill: var(--fg); font-size: 13.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
.clab { fill: var(--text); font-size: 14px; font-weight: 600; }
.hit { cursor: pointer; }
.mk { transition: opacity .15s; }
.dim .mk:not(.on) { opacity: .28; }

.tb { color: var(--fg); white-space: pre; line-height: 1.2; }
.navb { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 22px; font: 600 15px var(--font-semi); cursor: pointer; width: 100%; height: 100%; }
.navb:hover { background: var(--surface-3); color: #fff; }
.navb.act { background: var(--accent); border-color: var(--accent); color: #fff; }

.slicer { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 9px 14px 10px; display: flex; flex-direction: column; gap: 7px; }
.slicer .sh { color: var(--muted); font: 600 12px var(--font-semi); letter-spacing: .1em; display: flex; justify-content: space-between; }
.slicer .sh button { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 0 2px; font-size: 13px; }
.slicer .sh button:hover { color: var(--fg); }
.tiles { display: flex; gap: 6px; flex: 1; }
.tile { flex: 1; border: 1px solid var(--line); background: var(--surface-3); color: var(--text); border-radius: 6px; font: 600 14px var(--font-semi); cursor: pointer; white-space: nowrap; padding: 0 6px; }
.tile:hover { color: var(--fg); border-color: var(--line-2); }
.tile[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: #0A0D13; }
.slicer select { flex: 1; background: var(--surface-3); border: 1px solid var(--line); border-radius: 6px; padding: 0 10px; font: 600 14px var(--font-semi); color: var(--text); }

.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 30px 20px 14px 26px; }
.kpi .kl { color: var(--muted); font-size: 14.5px; }
.kpi .kv { color: var(--fg); font: 600 44px/1.15 var(--font-semi); letter-spacing: -.01em; font-variant-numeric: tabular-nums; white-space: nowrap; }

.tw { position: absolute; inset: 0; overflow: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
th { position: sticky; top: 0; z-index: 1; background: var(--surface); text-align: right; color: var(--muted); font: 600 12.5px var(--font-semi); padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th.sortable { cursor: pointer; } th.sortable:hover { color: var(--fg); }
td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--grid); color: var(--text); white-space: nowrap; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--surface-2); }
tbody tr.sel td { background: #1B2A44; }
.dimrows tbody tr:not(.sel) td { opacity: .45; }
tr.l0 td { color: var(--fg); font-weight: 700; }
tr.l1 td:first-child { padding-left: 30px; }
tr.l2 td:first-child { padding-left: 52px; color: var(--muted); }
.exp { display: inline-grid; place-items: center; width: 15px; height: 15px; border: 1px solid var(--line-2); border-radius: 3px; font-size: 11px; line-height: 1; margin-right: 8px; color: var(--muted); vertical-align: -2px; cursor: pointer; }
.exp:hover { color: var(--fg); border-color: var(--muted); }
.ind { display: inline-flex; align-items: center; gap: 7px; }
tfoot td { position: sticky; bottom: 0; color: var(--fg); font-weight: 700; background: var(--surface-3); border-bottom: 0; }
.dbar { position: relative; display: inline-flex; justify-content: flex-end; min-width: 140px; }
.dbar i { position: absolute; left: 0; top: 50%; height: 17px; transform: translateY(-50%); border-radius: 0 3px 3px 0; }
.dbar b { position: relative; font-weight: 600; color: var(--fg); }

.mapbox { position: absolute; inset: 0; border-radius: 10px; overflow: hidden; background: radial-gradient(120% 100% at 50% 40%, #101520, #0B0F16); }
.mapbox svg { width: 100%; height: 100%; display: block; }
.land { fill: #1A202B; stroke: #2A3240; stroke-width: .8; }
.land.data { fill: #232B39; stroke: #3A4559; cursor: pointer; }
.land.data:hover { fill: #2B3546; }
.land.sel { fill: #23406E; stroke: var(--accent); }
.mlab { fill: var(--fg); font-size: 16px; font-weight: 700; paint-order: stroke; stroke: #0B0F16; stroke-width: 4px; }
.mval { fill: var(--muted); font-size: 14px; font-weight: 600; paint-order: stroke; stroke: #0B0F16; stroke-width: 4px; font-variant-numeric: tabular-nums; }
.mapctl { position: absolute; right: 10px; bottom: 10px; display: grid; gap: 4px; }
.mapctl button { width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); cursor: pointer; font-size: 17px; line-height: 1; }
.mapctl button:hover { color: #fff; background: var(--surface-3); }
.lg { position: absolute; left: 0; display: flex; gap: 16px; flex-wrap: wrap; font-size: 13.5px; color: var(--text); }
.lg i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 7px; vertical-align: -1px; }

/* overlays */
.ovl { position: absolute; inset: 0; z-index: 50; background: rgba(6,8,12,.94); display: flex; flex-direction: column; padding: 28px 40px 36px; gap: 14px; }
.ovl .ob { display: flex; align-items: center; gap: 12px; }
.ovl .ob button { border: 1px solid var(--line-2); background: var(--surface-3); color: var(--fg); border-radius: 8px; padding: 9px 16px; font-size: 15px; font-weight: 600; cursor: pointer; }
.ovl .ob button:hover { background: var(--accent); border-color: var(--accent); }
.ovl .ob span { color: var(--muted); font-size: 15px; }
.ovl .ov { position: relative; flex: 1; }

#tip { position: fixed; z-index: 100; pointer-events: none; background: var(--surface-3); border: 1px solid var(--line-2); border-radius: 8px; padding: 9px 12px; font-size: 12.5px; color: var(--text); box-shadow: 0 10px 30px rgba(0,0,0,.45); min-width: 170px; font-variant-numeric: tabular-nums; }
#tip .t { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; margin-bottom: 4px; }
#tip .r { display: flex; justify-content: space-between; gap: 18px; line-height: 1.6; }
#tip .r b { color: var(--fg); }
#tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
#tip .h { color: var(--faint); font-size: 11px; margin-top: 5px; border-top: 1px solid var(--line); padding-top: 5px; }

@media (max-width: 900px) {
  .bar .doc span, .tbtn .lbl { display: none; }
  .fpane { position: absolute; right: 0; top: 46px; bottom: 40px; z-index: 60; box-shadow: -10px 0 30px rgba(0,0,0,.5); }
  .fpane.closed { box-shadow: none; }
  .stage { padding: 8px 48px 8px 8px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

// ---------------- model ----------------
const MESES = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const PAISES = ["Portugal","Espanha","França","Alemanha","Reino Unido"];
const PCOL = { "Portugal":"var(--s1)", "Espanha":"var(--s2)", "França":"var(--s3)", "Alemanha":"var(--s4)", "Reino Unido":"var(--s5)" };
const CATS = ["Casa & Jardim","Escritório","Tecnologia"];
const SEGS = ["Particular","Empresa","Educação"];
const QS = ["Q1","Q2","Q3","Q4"];
const CLI = RAW.clientes, PRO = RAW.produtos;
const ROWS = RAW.vendas.map(r => {
  const [data, cid, pid, qt, preco, desc, total, custo, lucro] = r;
  const m = +data.slice(5, 7) - 1, c = CLI[cid], p = PRO[pid];
  return { data, m, q: "Q" + (Math.floor(m / 3) + 1), cid, pid, qt, preco, desc, total, lucro,
           cliente: c[0], seg: c[1], cidade: c[2], pais: c[3], cat: p[0], sub: p[1], prod: p[2] };
});
const FIELDS = { q: { name: "Trimestre", vals: QS }, cat: { name: "Categoria", vals: CATS }, seg: { name: "Segmento", vals: SEGS }, pais: { name: "País", vals: PAISES } };
const SLICER_FIELD = { "Trimestre": "q", "Categoria": "cat", "Segmento": "seg", "País": "pais" };
const F = { q: new Set(), cat: new Set(), seg: new Set(), pais: new Set() };
let SEL = null;            // cross-filter selection {vid, f, v, label}
const VSTATE = {};         // per-visual state (drill, sort, expand)

const pass = (r, skipVid) => {
  for (const k in F) if (F[k].size && !F[k].has(r[k])) return false;
  if (SEL && SEL.vid !== skipVid && r[SEL.f] !== SEL.v) return false;
  return true;
};
const rowsFor = vid => ROWS.filter(r => pass(r, vid));
const sum = (a, k) => a.reduce((s, r) => s + r[k], 0);
function M(a) {
  const n = a.length, tv = sum(a, "total"), lt = sum(a, "lucro"), un = sum(a, "qt");
  const mx = k => n ? Math.max(...a.map(r => r[k])) : null, mn = k => n ? Math.min(...a.map(r => r[k])) : null;
  const lm = un ? lt / un : null;
  return { "Total Vendas": tv, "Lucro Total": lt, "Unidades Vendidas": un, "N Encomendas": n,
    "Encomenda Media": n ? tv / n : null, "Margem %": tv ? lt / tv : null, "Maior Encomenda": mx("total"), "Menor Encomenda": mn("total"),
    "Desconto Máximo": mx("desc"), "Preço Máximo": mx("preco"), "Preço Minimo": mn("preco"), "Lucro Médio": lm, "Lucro por Unidade": lm != null && un ? lm / un : null, "Sum TotalVendas": tv };
}
function group(a, key) { const m = new Map(); for (const r of a) { const k = typeof key === "function" ? key(r) : r[key]; (m.get(k) || m.set(k, []).get(k)).push(r); } return m; }

// ---------------- format ----------------
const nf = d => new Intl.NumberFormat("pt-PT", { minimumFractionDigits: d, maximumFractionDigits: d });
const N0 = nf(0), N1 = nf(1), N2 = nf(2);
const eur = v => v == null ? "(Em branco)" : N0.format(v) + " €";
const eur2 = v => v == null ? "(Em branco)" : N2.format(v) + " €";
const eurK = v => v == null ? "(Em branco)" : Math.abs(v) >= 1000 ? N1.format(v / 1000) + " mil €" : N0.format(v) + " €";
const kAx = v => v >= 1000 ? N0.format(v / 1000) + " mil" : N0.format(v);
const pct = (v, d = 1) => v == null ? "(Em branco)" : nf(d).format(v * 100) + " %";
const FMT = { "Total Vendas": eurK, "Lucro Total": eurK, "Unidades Vendidas": v => N0.format(v), "N Encomendas": v => N0.format(v), "Encomenda Media": eur,
  "Margem %": v => pct(v), "Preço Minimo": eur2, "Preço Máximo": eur2 };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------------- tooltip ----------------
const tip = document.getElementById("tip");
function showTip(e, title, lines, hint) {
  tip.innerHTML = `<div class="t">${esc(title)}</div>` + lines.map(([k, v, c]) =>
    `<div class="r"><span>${c ? `<i style="background:${c}"></i>` : ""}${esc(k)}</span><b>${esc(v)}</b></div>`).join("") + (hint ? `<div class="h">${esc(hint)}</div>` : "");
  tip.hidden = false;
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + pad, y = e.clientY + pad;
  if (x + w > innerWidth - 8) x = e.clientX - w - pad;
  if (y + h > innerHeight - 8) y = e.clientY - h - pad;
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
}
const hideTip = () => { tip.hidden = true; };
function bindTip(el, fn) {
  el.addEventListener("pointermove", e => { const t = fn(e); t ? showTip(e, t[0], t[1], t[2]) : hideTip(); });
  el.addEventListener("pointerleave", hideTip);
}

// ---------------- svg helpers ----------------
const NS = "http://www.w3.org/2000/svg";
function svgEl(w, h) { const s = document.createElementNS(NS, "svg"); s.setAttribute("viewBox", `0 0 ${w} ${h}`); s.setAttribute("class", "chart"); s.setAttribute("preserveAspectRatio", "none"); return s; }
function el(tag, attrs, parent, text) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; if (parent) parent.appendChild(e); return e; }
function niceMax(v, n = 5) {

  const raw = v / n, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;

function colPath(x, y, w, h, r = 4) { if (h <= 0) return ""; r = Math.min(r, w / 2, h); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; }
function barPathH(x, y, w, h, r = 4) { if (w <= 0) return ""; r = Math.min(r, h / 2, w); return `M${x},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h - r}Q${x + w},${y + h} ${x + w - r},${y + h}H${x}Z`; }
const ICON = {
  focus: '<svg viewBox="0 0 16 16"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
  table: '<svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M2 7h12M7 7v6" stroke="currentColor" stroke-width="1.4"/></svg>',
  up: '<svg viewBox="0 0 16 16"><path d="M8 13V3M4 7l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  drill: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 4.5v7M5 8.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  expand: '<svg viewBox="0 0 16 16"><path d="M4 3l4 4 4-4M4 9l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
};
function setSel(vid, f, v, label) {
  SEL = SEL && SEL.vid === vid && SEL.f === f && SEL.v === v ? null : { vid, f, v, label };
  render();
}
const isSel = (vid, f, v) => SEL && SEL.vid === vid && SEL.f === f && SEL.v === v;
const selHint = "Clique para filtrar os outros visuais";

// ---------------- data visual renderers ----------------
// Each returns { draw(body, w, h, vid), table(vid) -> {cols, rows}, header(vid) -> extra buttons }
const R = {};

R.cardVisual = (v) => {
  const m = v.roles.Data[0];
  return { kpi: true, draw(body) {
    const val = M(rowsFor(v.id))[m];
    body.innerHTML = `<div class="kl">${esc(m)}</div><div class="kv">${esc((FMT[m] || eur)(val))}</div>`;
  }};
};

function colData(vid) {
  const st = VSTATE[vid] ||= { path: null, all: false, drill: false };
  const a = rowsFor(vid);
  if (st.all) { const g = group(a, r => r.cat + " " + r.sub); return { field: "sub", items: [...g].map(([k, rr]) => ({ k, v: sum(rr, "total"), l: sum(rr, "lucro"), key: rr[0].sub })) }; }
  if (st.path) { const g = group(a.filter(r => r.cat === st.path), "sub"); return { field: "sub", items: [...g].map(([k, rr]) => ({ k, v: sum(rr, "total"), l: sum(rr, "lucro"), key: k })) }; }
  const g = group(a, "cat"); return { field: "cat", items: CATS.filter(c => g.has(c)).map(k => ({ k, v: sum(g.get(k), "total"), l: sum(g.get(k), "lucro"), key: k })) };
}
R.clusteredColumnChart = (v) => ({
  title(vid) { const st = VSTATE[vid] || {}; return st.path ? `${v.title} › ${st.path}` : st.all ? `${v.title} › todas as SubCategorias` : v.title; },
  header(vid) {
    const st = VSTATE[vid] ||= { path: null, all: false, drill: false };
    return [
      { icon: "up", label: "Subir nível", disabled: !st.path && !st.all, on: () => { st.path = null; st.all = false; render(); } },
      { icon: "drill", label: "Ativar desagregação: clique numa barra para descer de nível", pressed: st.drill, disabled: !!st.path || st.all, on: () => { st.drill = !st.drill; render(); } },
      { icon: "expand", label: "Expandir tudo um nível abaixo na hierarquia", disabled: !!st.path || st.all, on: () => { st.all = true; render(); } },
    ];
  },
  draw(body, W, H, vid) {
    const st = VSTATE[vid], d = colData(vid); d.items.sort((a, b) => b.v - a.v);
    const s = svgEl(W, H), L = 70, Rr = 10, T = 30, B = st.all ? 64 : 40;
    if (SEL && SEL.vid === vid) s.classList.add("dim");
    const { max, step } = niceMax(Math.max(...d.items.map(x => x.v), 1));
    const y = val => T + (H - T - B) * (1 - val / max);
    for (let t = 0; t <= max + 1e-9; t += step) { el("line", { x1: L, x2: W - Rr, y1: y(t), y2: y(t), class: "gl" }, s); el("text", { x: L - 10, y: y(t) + 5, "text-anchor": "end", class: "ax" }, s, kAx(t)); }
    const bw = (W - L - Rr) / Math.max(d.items.length, 1), w = Math.min(90, bw * .58);
    d.items.forEach((it, i) => {
      const x = L + bw * i + (bw - w) / 2, yy = y(it.v);
      el("path", { d: colPath(x, yy, w, y(0) - yy), fill: "var(--s1)", class: "mk" + (isSel(vid, d.field, it.key) ? " on" : "") }, s);
      el("text", { x: x + w / 2, y: yy - 9, "text-anchor": "middle", class: "vlab" }, s, kAx(it.v));
      const lab = el("text", { x: x + w / 2, y: H - B + 24, "text-anchor": "middle", class: "clab" }, s, st.all ? it.key : it.k);
      if (st.all) { lab.setAttribute("font-size", "12"); el("text", { x: x + w / 2, y: H - B + 42, "text-anchor": "middle", class: "ax", "font-size": 11 }, s, it.k.replace(" " + it.key, "")); }
      const hit = el("rect", { x: L + bw * i, y: T - 10, width: bw, height: H - T - B + 50, fill: "transparent", class: "hit" }, s);
      bindTip(hit, () => [it.k, [["Total Vendas", eur(it.v), "var(--s1)"], ["Lucro Total", eur(it.l), "var(--s3)"], ["Margem %", pct(it.v ? it.l / it.v : null)]],
        st.drill && !st.path && !st.all ? "Clique para desagregar" : selHint]);
      hit.addEventListener("click", e => { e.stopPropagation(); if (st.drill && !st.path && !st.all) { st.path = it.key; if (SEL && SEL.vid === vid) SEL = null; render(); } else setSel(vid, d.field, it.key, it.key); });
    });
    body.append(s);
  },
  table(vid) { const d = colData(vid); return { cols: [d.field === "cat" ? "Categoria" : "SubCategoria", "Total Vendas", "Lucro Total"], rows: d.items.sort((a, b) => b.v - a.v).map(i => [i.k, eur(i.v), eur(i.l)]) }; },
});

// Like Power BI, months without any rows are left out of the axis.
function monthly(vid) { const g = group(rowsFor(vid), "m"); return MESES.map((n, i) => ({ n, i, v: sum(g.get(i) || [], "total"), l: sum(g.get(i) || [], "lucro") })).filter(p => g.has(p.i)); }
R.lineChart = (v) => ({
  draw(body, W, H, vid) {
    const d = monthly(vid), s = svgEl(W, H), L = 70, Rr = 76, T = 40, B = 34;
    const lg = document.createElement("div"); lg.className = "lg"; lg.style.top = "0";
    lg.innerHTML = `<span><i style="background:var(--s1)"></i>Total Vendas</span><span><i style="background:var(--s3)"></i>Lucro Total</span>`;
    const { max, step } = niceMax(Math.max(...d.map(x => x.v), 1));
    if (!d.length) { body.innerHTML = `<div class="tw" style="display:grid;place-items:center;color:var(--muted)">Sem dados para os filtros atuais</div>`; return; }
    const n1 = Math.max(d.length - 1, 1), x = i => d.length === 1 ? (L + W - Rr) / 2 : L + (W - L - Rr) * i / n1, y = val => T + (H - T - B) * (1 - val / max);
    for (let t = 0; t <= max + 1e-9; t += step) { el("line", { x1: L, x2: W - Rr, y1: y(t), y2: y(t), class: "gl" }, s); el("text", { x: L - 10, y: y(t) + 5, "text-anchor": "end", class: "ax" }, s, kAx(t)); }
    d.forEach((p, i) => el("text", { x: x(i), y: H - 8, "text-anchor": "middle", class: "ax" }, s, p.n));
    const defs = el("defs", {}, s);
    [["v", "var(--s1)", .22], ["l", "var(--s3)", .10]].forEach(([k, c, op], si) => {
      const g = el("linearGradient", { id: `g${vid}${si}`, x1: 0, x2: 0, y1: 0, y2: 1 }, defs);
      el("stop", { offset: "0%", "stop-color": c, "stop-opacity": op }, g); el("stop", { offset: "100%", "stop-color": c, "stop-opacity": 0 }, g);
      const line = d.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + "," + y(p[k]).toFixed(1)).join("");
      el("path", { d: line + `L${x(d.length - 1)},${y(0)}L${x(0)},${y(0)}Z`, fill: `url(#g${vid}${si})` }, s);
      el("path", { d: line, fill: "none", stroke: c, "stroke-width": 3, "stroke-linejoin": "round", "stroke-linecap": "round" }, s);
      d.forEach((p, i) => el("circle", { cx: x(i), cy: y(p[k]), r: isSel(vid, "m", p.i) ? 7 : 4, fill: c, stroke: "var(--surface)", "stroke-width": 2 }, s));
      const last = d[d.length - 1]; el("text", { x: x(d.length - 1) + 12, y: y(last[k]) + 5, class: "vlab" }, s, kAx(last[k]));
    });
    const cross = el("line", { y1: T, y2: H - B, stroke: "var(--muted)", "stroke-dasharray": "3 3", visibility: "hidden" }, s);
    const hit = el("rect", { x: L - 20, y: T, width: W - L - Rr + 40, height: H - T - B, fill: "transparent", class: "hit" }, s);
    const idx = e => { const pt = s.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const p = pt.matrixTransform(s.getScreenCTM().inverse()); return d.length === 1 ? 0 : Math.max(0, Math.min(d.length - 1, Math.round((p.x - L) / ((W - L - Rr) / n1)))); };
    hit.addEventListener("pointerleave", () => cross.setAttribute("visibility", "hidden"));
    bindTip(hit, e => { const i = idx(e); cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("visibility", "visible");
      return [d[i].n + " 2024", [["Total Vendas", eur(d[i].v), "var(--s1)"], ["Lucro Total", eur(d[i].l), "var(--s3)"], ["Margem %", pct(d[i].v ? d[i].l / d[i].v : null)]], selHint]; });
    hit.addEventListener("click", e => { e.stopPropagation(); const p = d[idx(e)]; setSel(vid, "m", p.i, p.n); });
    body.append(s, lg);
  },
  table(vid) { return { cols: ["Mês", "Total Vendas", "Lucro Total"], rows: monthly(vid).map(p => [p.n, eur(p.v), eur(p.l)]) }; },
});

function byPais(vid) { const g = group(rowsFor(vid), "pais"); return PAISES.map(k => { const m = M(g.get(k) || []); return { k, c: PCOL[k], v: m["Total Vendas"], l: m["Lucro Total"], n: m["N Encomendas"] }; }); }
R.donutChart = (v) => ({
  draw(body, W, H, vid) {
    const d = byPais(vid), total = d.reduce((t, x) => t + x.v, 0), s = svgEl(W, H);
    if (SEL && SEL.vid === vid) s.classList.add("dim");
    const cx = W / 2, cy = (H - 40) / 2 + 6, Rr = Math.min(W * .3, (H - 60) * .4), r = Rr * .66;
    let a0 = -Math.PI / 2;
    d.forEach(it => {
      const frac = total ? it.v / total : 0, a1 = a0 + frac * 2 * Math.PI;
      if (frac > 0) {
        const g0 = a0 + .012, g1 = Math.max(g0, a1 - .012), lg = g1 - g0 > Math.PI ? 1 : 0, P = (a, rr) => [cx + rr * Math.cos(a), cy + rr * Math.sin(a)];
        const [x0, y0] = P(g0, Rr), [x1, y1] = P(g1, Rr), [x2, y2] = P(g1, r), [x3, y3] = P(g0, r);
        const p = el("path", { d: `M${x0},${y0}A${Rr},${Rr} 0 ${lg} 1 ${x1},${y1}L${x2},${y2}A${r},${r} 0 ${lg} 0 ${x3},${y3}Z`, fill: it.c, class: "mk hit" + (isSel(vid, "pais", it.k) ? " on" : "") }, s);
        bindTip(p, () => [it.k, [["Total Vendas", eur(it.v), it.c], ["% do total", pct(frac)], ["Lucro Total", eur(it.l)]], selHint]);
        p.addEventListener("click", e => { e.stopPropagation(); setSel(vid, "pais", it.k, it.k); });
        if (frac >= .04) { const am = (g0 + g1) / 2, [lx, ly] = P(am, Rr + 18); el("text", { x: lx, y: ly + 5, "text-anchor": Math.cos(am) >= 0 ? "start" : "end", class: "clab" }, s, `${it.k} ${N0.format(frac * 100)}%`); }
      }
      a0 = a1;
    });
    el("text", { x: cx, y: cy - 6, "text-anchor": "middle", class: "ax" }, s, "Total Vendas");
    el("text", { x: cx, y: cy + 24, "text-anchor": "middle", class: "vlab", "font-size": 24 }, s, eurK(total));
    const lg = document.createElement("div"); lg.className = "lg"; lg.style.bottom = "0"; lg.style.right = "0"; lg.style.justifyContent = "center";
    lg.innerHTML = d.map(it => `<span><i style="background:${it.c}"></i>${esc(it.k)}</span>`).join("");
    body.append(s, lg);
  },
  table(vid) { return { cols: ["País", "Total Vendas", "Lucro Total"], rows: byPais(vid).map(p => [p.k, eur(p.v), eur(p.l)]) }; },
});

function subData(vid) { const g = group(rowsFor(vid), r => r.cat + "|" + r.sub); return [...g].map(([k, rr]) => { const [cat, sub] = k.split("|"); return { cat, sub, v: sum(rr, "total"), m: M(rr)["Margem %"] }; }).sort((a, b) => b.v - a.v); }
R.clusteredBarChart = (v) => ({
  draw(body, W, H, vid) {
    const d = subData(vid), s = svgEl(W, H); if (SEL && SEL.vid === vid) s.classList.add("dim");
    const L = 140, Rr = 90, rowH = Math.min(52, (H - 6) / Math.max(d.length, 1)), max = Math.max(...d.map(x => x.v), 1);
    d.forEach((it, i) => {
      const y = 3 + i * rowH, w = (W - L - Rr) * it.v / max, bh = Math.min(24, rowH * .62);
      el("text", { x: L - 12, y: y + rowH / 2 + 5, "text-anchor": "end", class: "clab" }, s, it.sub);
      el("path", { d: barPathH(L, y + (rowH - bh) / 2, w, bh), fill: "var(--s1)", class: "mk" + (isSel(vid, "sub", it.sub) ? " on" : "") }, s);
      el("text", { x: L + w + 10, y: y + rowH / 2 + 5, class: "vlab" }, s, kAx(it.v));
      const hit = el("rect", { x: 0, y, width: W, height: rowH, fill: "transparent", class: "hit" }, s);
      bindTip(hit, () => [it.sub, [["Categoria", it.cat], ["Total Vendas", eur(it.v), "var(--s1)"], ["Margem %", pct(it.m)]], selHint]);
      hit.addEventListener("click", e => { e.stopPropagation(); setSel(vid, "sub", it.sub, it.sub); });
    });
    body.append(s);
  },
  table(vid) { return { cols: ["SubCategoria", "Categoria", "Total Vendas"], rows: subData(vid).map(x => [x.sub, x.cat, eur(x.v)]) }; },
});

function spark(vals) {
  const W = 110, H = 26, max = Math.max(...vals, 1), pts = vals.map((v, i) => [i * W / 11, H - 3 - (H - 6) * v / max]);
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="display:inline-block;vertical-align:middle;overflow:visible"><polyline points="${pts.map(p => p.map(n => n.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="var(--s1)" stroke-width="1.8" stroke-linejoin="round"/><circle cx="${W}" cy="${pts[11][1].toFixed(1)}" r="3" fill="var(--s3)"/></svg>`;
}
function indicator(v, lo, hi) {
  if (v == null) return "";
  const t = hi > lo ? (v - lo) / (hi - lo) : 1;
  const [shape, c, lab] = t >= .65 ? ["M6,1L11,10H1Z", "var(--good)", "alta"] : t >= .45 ? ["M6,1.5A4.5,4.5 0 1 1 5.99,1.5Z", "var(--warn)", "média"] : ["M1,2H11L6,11Z", "var(--bad)", "baixa"];
  return `<span class="ind" title="Margem ${lab}"><svg viewBox="0 0 12 12" width="12" height="12"><path d="${shape}" fill="${c}"/></svg>${pct(v)}</span>`;
}
const dbar = (v, max, c = "var(--s1)") => `<span class="dbar"><i style="width:${max ? (100 * v / max).toFixed(1) : 0}%;background:color-mix(in srgb, ${c} 38%, transparent)"></i><b>${eur(v)}</b></span>`;

function prodRows(vid) {
  const st = VSTATE[vid] ||= { closed: new Set(), open: new Set() };
  const a = rowsFor(vid), out = [];
  const subsAll = [...group(a, r => r.cat + "|" + r.sub)].map(([k, rr]) => M(rr)["Margem %"]).filter(x => x != null);
  const lo = Math.min(...subsAll), hi = Math.max(...subsAll);
  const allSubs = [...group(a, "sub")].map(([, rr]) => sum(rr, "total")), maxV = Math.max(...allSubs, 1);
  CATS.forEach(cat => {
    const ca = a.filter(r => r.cat === cat); if (!ca.length) return;
    out.push({ lvl: 0, key: cat, f: "cat", rows: ca, open: !st.closed.has(cat) });
    if (st.closed.has(cat)) return;
    [...group(ca, "sub")].sort((x, y) => sum(y[1], "total") - sum(x[1], "total")).forEach(([sub, sa]) => {
      const sk = cat + "|" + sub;
      out.push({ lvl: 1, key: sub, f: "sub", rows: sa, open: st.open.has(sk), tkey: sk });
      if (st.open.has(sk)) [...group(sa, "prod")].sort((x, y) => sum(y[1], "total") - sum(x[1], "total")).forEach(([prod, pa]) => out.push({ lvl: 2, key: prod, f: "prod", rows: pa }));
    });
  });
  return { out, lo, hi, maxV, all: a };
}
R.pivotTable = (v) => v.roles.Columns ? R.heatPivot(v) : ({
  draw(body, W, H, vid) {
    const st = VSTATE[vid] ||= { closed: new Set(), open: new Set() };
    const { out, lo, hi, maxV, all } = prodRows(vid);
    const tm = M(all);
    let h = `<div class="tw"><table class="${SEL && SEL.vid === vid ? "dimrows" : ""}"><thead><tr><th>Categoria / SubCategoria / Produto</th><th>Margem %</th><th>Preço Mínimo</th><th>Preço Máximo</th><th>Total Vendas</th><th>Total Vendas por Mês</th></tr></thead><tbody>`;
    out.forEach((r, i) => {
      const m = M(r.rows), bm = group(r.rows, "m"), exp = r.lvl < 2 ? `<span class="exp" data-x="${i}">${r.open ? "−" : "+"}</span>` : "";
      h += `<tr class="l${r.lvl}${isSel(vid, r.f, r.key) ? " sel" : ""}" data-i="${i}"><td>${exp}${esc(r.key)}</td><td>${indicator(m["Margem %"], lo, hi)}</td><td>${eur2(m["Preço Minimo"])}</td><td>${eur2(m["Preço Máximo"])}</td><td>${r.lvl ? dbar(m["Total Vendas"], maxV) : eur(m["Total Vendas"])}</td><td>${spark(MESES.map((_, k) => sum(bm.get(k) || [], "total")))}</td></tr>`;
    });
    h += `</tbody><tfoot><tr><td>Total</td><td>${pct(tm["Margem %"])}</td><td>${eur2(tm["Preço Minimo"])}</td><td>${eur2(tm["Preço Máximo"])}</td><td>${eur(tm["Total Vendas"])}</td><td></td></tr></tfoot></table></div>`;
    body.innerHTML = out.length ? h : `<div class="tw" style="display:grid;place-items:center;color:var(--muted)">Sem dados para os filtros atuais</div>`;
    body.querySelectorAll(".exp").forEach(x => x.addEventListener("click", e => { e.stopPropagation(); const r = out[+x.dataset.x];
      if (r.lvl === 0) st.closed.has(r.key) ? st.closed.delete(r.key) : st.closed.add(r.key); else st.open.has(r.tkey) ? st.open.delete(r.tkey) : st.open.add(r.tkey); render(); }));
    body.querySelectorAll("tbody tr").forEach(tr => tr.addEventListener("click", e => { e.stopPropagation(); const r = out[+tr.dataset.i]; setSel(vid, r.f, r.key, r.key); }));
  },
  table(vid) { return { cols: ["Nível", "Nome", "Margem %", "Preço Mínimo", "Preço Máximo", "Total Vendas"], rows: prodRows(vid).out.map(r => { const m = M(r.rows); return [["Categoria", "SubCategoria", "Produto"][r.lvl], r.key, pct(m["Margem %"]), eur2(m["Preço Minimo"]), eur2(m["Preço Máximo"]), eur(m["Total Vendas"])]; }) }; },
});

R.heatPivot = (v) => ({
  draw(body, W, H, vid) {
    const st = VSTATE[vid] ||= { open: new Set() };
    const a = rowsFor(vid), gP = group(a, "pais");
    const rows = [];
